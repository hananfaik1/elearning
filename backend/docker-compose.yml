services:
  postgres:
    image: postgres:16
    container_name: elearning-postgres
    environment:
      POSTGRES_DB: elearning_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - elearning_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elearning-redis
    ports:
      - "6379:6379"
    volumes:
      - elearning_redis_data:/data

volumes:
  elearning_postgres_data:
  elearning_redis_data: